<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3542"/>
      <stop offset="50%" stop-color="#123C4B"/>
      <stop offset="100%" stop-color="#072630"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A8D5D8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#78B9C2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#072630" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A8D5D8" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Crisp Network Mesh Topology -->
  <g opacity="0.65" stroke="#78B9C2" stroke-width="1.2">
    <line x1="210" y1="260" x2="330" y2="175" stroke-dasharray="4 4"/>
    <line x1="330" y1="175" x2="480" y2="205"/>
    <line x1="480" y1="205" x2="590" y2="145" stroke-dasharray="3 3"/>
    <line x1="330" y1="175" x2="415" y2="310"/>
    <line x1="415" y1="310" x2="565" y2="285"/>
    <line x1="480" y1="205" x2="565" y2="285"/>

    <!-- Crisp Node Dots -->
    <circle cx="210" cy="260" r="4" fill="#A8D5D8"/>
    <circle cx="330" cy="175" r="6" fill="#F5F7F4"/>
    <circle cx="480" cy="205" r="5" fill="#A8D5D8"/>
    <circle cx="590" cy="145" r="3.5" fill="#A8D5D8"/>
    <circle cx="415" cy="310" r="5" fill="#F5F7F4" fill-opacity="0.9"/>
    <circle cx="565" cy="285" r="4" fill="#A8D5D8"/>

    <!-- Concentric Radar / Wave Rings -->
    <circle cx="330" cy="175" r="22" fill="none" stroke="#A8D5D8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="330" cy="175" r="42" fill="none" stroke="#A8D5D8" stroke-opacity="0.2" stroke-dasharray="3 4"/>
  </g>

  <!-- Central Editorial Branding -->
  <g text-anchor="middle">
    <text x="400" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="800" letter-spacing="14" fill="#F5F7F4">ERN</text>
    <line x1="320" y1="238" x2="480" y2="238" stroke="#A8D5D8" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="400" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#A8D5D8">EXPIRY RESCUE NETWORK</text>
    <text x="400" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" letter-spacing="2.8" fill="#C5D7D8">FOOD REDISTRIBUTION &amp; RESCUE PLATFORM</text>
  </g>

  <!-- Technical Framing & Coordinate Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#A8D5D8" stroke-width="1.2" stroke-opacity="0.4"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#A8D5D8" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="50" y="460" font-family="monospace" font-size="10" font-weight="600" fill="#A8D5D8" fill-opacity="0.7">ECOSYSTEM // FEATURE COMPLETE</text>
  <text x="750" y="460" text-anchor="end" font-family="monospace" font-size="10" font-weight="600" fill="#C5D7D8" fill-opacity="0.7">NODE: SUSTAINABILITY</text>
</svg>
