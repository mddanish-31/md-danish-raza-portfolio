<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3542"/>
      <stop offset="50%" stop-color="#123C4B"/>
      <stop offset="100%" stop-color="#082833"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A8D5D8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#78B9C2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#082833" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="54" height="54" fill="none" stroke="#A8D5D8" stroke-width="0.75" stroke-opacity="0.10" rx="4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#cardGrid)"/>

  <!-- Academic Starburst / Constellation Accents -->
  <g opacity="0.55" stroke="#78B9C2" fill="none">
    <circle cx="400" cy="115" r="14" stroke-width="1.2"/>
    <circle cx="400" cy="115" r="3" fill="#F5F7F4"/>
    <line x1="400" y1="88" x2="400" y2="101" stroke-width="1.5"/>
    <line x1="400" y1="129" x2="400" y2="142" stroke-width="1.5"/>
    <line x1="373" y1="115" x2="386" y2="115" stroke-width="1.5"/>
    <line x1="414" y1="115" x2="427" y2="115" stroke-width="1.5"/>

    <!-- Framing lines -->
    <line x1="190" y1="235" x2="260" y2="235" stroke-width="1.2"/>
    <line x1="540" y1="235" x2="610" y2="235" stroke-width="1.2"/>
  </g>

  <!-- Central Title & Subtitles -->
  <g text-anchor="middle">
    <text x="400" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#F5F7F4">HALL OF FAME</text>
    <line x1="280" y1="235" x2="520" y2="235" stroke="#A8D5D8" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="400" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#A8D5D8">SECTION D // CSE 2026</text>
    <text x="400" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" letter-spacing="2.8" fill="#C5D7D8">DIGITAL MEMORY BOOK &amp; TRIBUTE ARCHIVE</text>
  </g>

  <!-- Technical Framing Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#A8D5D8" stroke-width="1.2" stroke-opacity="0.4"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#A8D5D8" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="50" y="460" font-family="monospace" font-size="10" font-weight="600" fill="#A8D5D8" fill-opacity="0.7">REPOSITORY // GITHUB VERIFIED</text>
  <text x="750" y="460" text-anchor="end" font-family="monospace" font-size="10" font-weight="600" fill="#C5D7D8" fill-opacity="0.7">BATCH: CSE 2022-2026</text>
</svg>
