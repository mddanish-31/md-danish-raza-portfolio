<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3542"/>
      <stop offset="50%" stop-color="#123C4B"/>
      <stop offset="100%" stop-color="#082833"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A8D5D8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#78B9C2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#082833" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#A8D5D8" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#dotPattern)"/>

  <!-- Marketplace Orbital Geometry -->
  <g opacity="0.5" stroke="#78B9C2" fill="none">
    <ellipse cx="400" cy="250" rx="260" ry="135" stroke-width="1" stroke-dasharray="6 6"/>
    <ellipse cx="400" cy="250" rx="190" ry="95" stroke-width="1.2"/>
    <ellipse cx="400" cy="250" rx="115" ry="55" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Orbital Nodes -->
    <circle cx="180" cy="205" r="5" fill="#A8D5D8"/>
    <circle cx="620" cy="295" r="5" fill="#F5F7F4"/>
    <circle cx="400" cy="115" r="6" fill="#A8D5D8" fill-opacity="0.9"/>
    <circle cx="400" cy="385" r="4.5" fill="#F5F7F4"/>
    <circle cx="285" cy="320" r="4" fill="#A8D5D8"/>
    <circle cx="515" cy="180" r="5" fill="#A8D5D8"/>
  </g>

  <!-- Central Editorial Title -->
  <g text-anchor="middle">
    <text x="400" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="14" fill="#F5F7F4">SAATHI</text>
    <line x1="320" y1="238" x2="480" y2="238" stroke="#A8D5D8" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="400" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#A8D5D8">SERVICE MARKETPLACE</text>
    <text x="400" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" letter-spacing="2.8" fill="#C5D7D8">ON-DEMAND PROFESSIONAL NETWORK</text>
  </g>

  <!-- Technical Framing Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#A8D5D8" stroke-width="1.2" stroke-opacity="0.4"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#A8D5D8" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="50" y="460" font-family="monospace" font-size="10" font-weight="600" fill="#A8D5D8" fill-opacity="0.7">STATUS // IN DEVELOPMENT</text>
  <text x="750" y="460" text-anchor="end" font-family="monospace" font-size="10" font-weight="600" fill="#C5D7D8" fill-opacity="0.7">DOMAIN: MULTI-SERVICE MARKETPLACE</text>
</svg>
